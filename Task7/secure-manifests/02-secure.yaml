apiVersion: v1
kind: Pod
metadata:
  name: pod-secure-hostpath
  namespace: audit-zone
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: nginx
      image: nginx:1.21
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - mountPath: /data
          name: safe-volume
  volumes:
    - name: safe-volume
      emptyDir: {}
